name: Pre-Breakout Round 3A Exit Architecture

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'research/round3a_exit_architecture.py'
      - '.github/workflows/prebreakout-round3a.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  BINANCE_CACHE_DIR: research/cache/binance

jobs:
  round3a:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/requirements.txt
      - name: Restore Binance archive cache
        uses: actions/cache@v4
        with:
          path: research/cache/binance
          key: binance-hourly-${{ runner.os }}-v1
          restore-keys: |
            binance-hourly-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r research/requirements.txt
      - name: Run Round 3A
        run: python research/round3a_exit_architecture.py
      - name: Show top variants
        if: always()
        run: |
          if [ -f research/results/round3a/summary.csv ]; then
            python - <<'PY'
          import pandas as pd
          p='research/results/round3a/summary.csv'
          x=pd.read_csv(p).sort_values(['net_pnl_usdt','profit_factor'],ascending=False)
          print(x.head(20).to_string(index=False))
          PY
          fi
      - name: Upload Round 3A results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prebreakout-round3a-exit-architecture
          path: research/results/round3a/*
          if-no-files-found: warn
          retention-days: 30
