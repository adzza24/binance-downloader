name: Build High-Purity Signal Models

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'research/build_high_purity_models.py'
      - 'research/high_purity_signal_features.json'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/build_high_purity_models.py
            research/high_purity_signal_features.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install exact discovery environment
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.3 numpy==2.3.5 scipy==1.17.0 joblib==1.5.3 threadpoolctl==3.6.0 scikit-learn==1.8.0 pyarrow

      - name: Download original canonical shard artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/cache/high_purity_model_source
          gh run download 37243430582 -n drh2-stage3-canonical-0 -D research/cache/high_purity_model_source/drh2-canonical-0
          gh run download 37243430582 -n drh2-stage3-canonical-1 -D research/cache/high_purity_model_source/drh2-canonical-1
          gh run download 37243430582 -n drh2-stage3-canonical-2 -D research/cache/high_purity_model_source/drh2-canonical-2
          gh run download 37243430582 -n drh2-stage3-canonical-3 -D research/cache/high_purity_model_source/drh2-canonical-3
          find research/cache/high_purity_model_source -name 'samples_part_*.parquet' -print | sort

      - name: Rebuild and verify frozen models
        run: python research/build_high_purity_models.py

      - name: Commit verified model artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -f research/results/daily_return_harvest/high_purity_runtime/models/event_hgb_model.pkl
          git add --sparse -f research/results/daily_return_harvest/high_purity_runtime/models/familyB_model.pkl
          git add --sparse -f research/results/daily_return_harvest/high_purity_runtime/models/familyC15_model.pkl
          git add --sparse -f research/results/daily_return_harvest/high_purity_runtime/models/model_manifest.json
          git commit -m "Persist verified high-purity signal models"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin master
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: high-purity-models
          path: research/results/daily_return_harvest/high_purity_runtime/models/
          retention-days: 30
