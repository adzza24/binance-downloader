name: BTC 2024 W3 Tight Lookalikes

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'research/btc_w3_matched_lookalike_tight.py'
      - '.github/workflows/btc-w3-matched-lookalikes-tight-2024.yml'

permissions:
  contents: write
  actions: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/btc_w3_matched_lookalike_analysis.py
            research/btc_w3_matched_lookalike_tight.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis environment
        run: |
          python -m pip install --upgrade pip
          pip install pandas==3.0.6 numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 pyarrow==25.0.1 tabulate

      - name: Download BTC 2024 forensic artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/input/btc_forensic_2024
          gh run download 37451123723 --repo adzza24/binance-downloader --name btc-forensic-transition-2024-full --dir research/input/btc_forensic_2024

      - name: Run tight matched lookalike comparison
        run: python research/btc_w3_matched_lookalike_tight.py

      - name: Show analysis
        run: cat research/results/daily_return_harvest/btc_w3_matched_lookalikes_tight_2024/ANALYSIS.md

      - name: Commit compact research outputs
        run: |
          OUT=research/results/daily_return_harvest/btc_w3_matched_lookalikes_tight_2024
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -f "$OUT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add BTC 2024 tight-lookalike results"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin master
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: btc-w3-matched-lookalikes-tight-2024
          path: research/results/daily_return_harvest/btc_w3_matched_lookalikes_tight_2024/
          retention-days: 90
