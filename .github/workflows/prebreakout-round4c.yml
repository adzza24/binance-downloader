name: Pre-Breakout Round 4C MA Robustness

on:
  push:
    paths:
      - 'research/round4c_ma_robustness.py'
      - '.github/workflows/prebreakout-round4c.yml'
  workflow_dispatch:

jobs:
  round4c:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: 1
      BINANCE_CACHE_DIR: research/cache/binance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/requirements.txt
      - name: Restore Binance archive cache
        uses: actions/cache@v4
        with:
          path: research/cache/binance
          key: binance-hourly-${{ runner.os }}-v1
          restore-keys: |
            binance-hourly-${{ runner.os }}-
            binance-vision-v2-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r research/requirements.txt
      - name: Run Round 4C
        run: python research/round4c_ma_robustness.py
      - name: Show headline results
        run: |
          head -40 research/results/round4c/robustness_ranking.csv
          cat research/results/round4c/cascade_diagnostics.csv
      - name: Upload Round 4C results
        uses: actions/upload-artifact@v4
        with:
          name: prebreakout-round4c-ma-robustness
          path: research/results/round4c/*
          retention-days: 30
