name: Pre-Breakout Round 3E Large-Winner Exits

on:
  push:
    paths:
      - 'research/round3e_large_winner_exits.py'
      - 'research/round3e_open_ended.py'
      - '.github/workflows/prebreakout-round3e.yml'
  workflow_dispatch:

jobs:
  round3e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      BINANCE_CACHE_DIR: research/cache/binance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Restore Binance archive cache
        uses: actions/cache@v4
        with:
          path: research/cache/binance
          key: binance-hourly-${{ runner.os }}-v1
          restore-keys: |
            binance-hourly-${{ runner.os }}-
            binance-vision-v2-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r research/requirements.txt
      - name: Run Round 3E open-ended
        run: python research/round3e_open_ended.py
      - name: Show variants
        if: always()
        run: |
          if [ -f research/results/round3e_open/summary.csv ]; then
            python - <<'PY'
          import pandas as pd
          p='research/results/round3e_open/summary.csv'
          x=pd.read_csv(p).sort_values(['total_mtm_pnl_usdt','realised_profit_factor'],ascending=False)
          print(x.to_string(index=False))
          PY
          fi
      - name: Upload Round 3E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prebreakout-round3e-open-ended
          path: research/results/round3e_open/*
          if-no-files-found: warn
          retention-days: 30
