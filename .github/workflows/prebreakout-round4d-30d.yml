name: Pre-Breakout Round 4D 30D Early Exit Diagnostic

on:
  push:
    paths:
      - 'research/round4d_30d_early_exit_diagnostic.py'
      - '.github/workflows/prebreakout-round4d-30d.yml'
  workflow_dispatch:

jobs:
  round4d30:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: 1
      BINANCE_CACHE_DIR: research/cache/binance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/requirements.txt
      - name: Restore Binance archive cache
        uses: actions/cache@v4
        with:
          path: research/cache/binance
          key: binance-hourly-${{ runner.os }}-v1
          restore-keys: |
            binance-hourly-${{ runner.os }}-
            binance-vision-v2-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r research/requirements.txt
      - name: Run diagnostic
        run: python research/round4d_30d_early_exit_diagnostic.py
      - name: Show results
        run: |
          cat research/results/round4d_30d/summary.csv
          cat research/results/round4d_30d/year_summary.csv
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: prebreakout-round4d-30d-diagnostic
          path: research/results/round4d_30d/*
          retention-days: 30
