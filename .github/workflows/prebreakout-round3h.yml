name: Pre-Breakout Round 3H Fixed Trail Sensitivity

on:
  push:
    paths:
      - 'research/round3h_fixed_trail_sensitivity.py'
      - '.github/workflows/prebreakout-round3h.yml'
  workflow_dispatch:

jobs:
  round3h:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: 1
      BINANCE_CACHE_DIR: research/cache/binance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/requirements.txt
      - name: Restore Binance archive cache
        uses: actions/cache@v4
        with:
          path: research/cache/binance
          key: binance-hourly-${{ runner.os }}-v1
          restore-keys: |
            binance-hourly-${{ runner.os }}-
            binance-vision-v2-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r research/requirements.txt
      - name: Run Round 3H
        run: python research/round3h_fixed_trail_sensitivity.py
      - name: Show results
        run: |
          cat research/results/round3h/summary.csv
          cat research/results/round3h/summary_2022_onward.csv
      - name: Upload Round 3H results
        uses: actions/upload-artifact@v4
        with:
          name: prebreakout-round3h-fixed-trail-sensitivity
          path: research/results/round3h/*
          retention-days: 30
