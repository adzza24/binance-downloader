name: Pre-Breakout Exit Backtest - Round 1 Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/requirements.txt

      - name: Install research dependencies
        run: pip install -r research/requirements.txt

      - name: Run historical exit backtest
        run: python research/backtest.py --config research/config.json --out research/results/round_1_baseline

      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prebreakout-round1-baseline
          path: research/results/round_1_baseline/*
          if-no-files-found: warn
          retention-days: 30
