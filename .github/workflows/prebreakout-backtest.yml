name: Pre-Breakout Exit Backtest

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'research/**'
      - '.github/workflows/prebreakout-backtest.yml'

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/requirements.txt

      - name: Install research dependencies
        run: pip install -r research/requirements.txt

      - name: Run historical exit backtest
        run: python research/backtest.py --config research/config.json --out research/results

      - name: Show summary
        if: always()
        run: |
          if [ -f research/results/backtest_summary.csv ]; then
            cat research/results/backtest_summary.csv
          fi

      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prebreakout-backtest-results
          path: research/results/*.csv
          if-no-files-found: warn
          retention-days: 30
