name: Pre-Breakout Round 4I MA General Exit

on:
  push:
    paths:
      - 'research/round4i_ma_general_exit.py'
      - '.github/workflows/prebreakout-round4i.yml'
  workflow_dispatch:

jobs:
  round4i:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore Binance archive cache
        uses: actions/cache@v4
        with:
          path: research/data
          key: binance-research-data-v1
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run Round 4I research
        run: python research/round4i_ma_general_exit.py
      - name: Show summary
        run: |
          echo '--- summary.csv ---'
          cat research/results/round4i/summary.csv
          echo '--- year_summary.csv ---'
          cat research/results/round4i/year_summary.csv
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: prebreakout-round4i-ma-general-exit
          path: research/results/round4i/
          retention-days: 90
