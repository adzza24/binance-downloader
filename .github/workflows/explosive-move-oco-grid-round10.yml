name: Explosive Move OCO Grid Round 10

on:
  push:
    branches: [round-3]
    paths:
      - 'research/explosive_move_oco_grid_round10.py'
      - '.github/workflows/explosive-move-oco-grid-round10.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: explosive-move-oco-grid-round10-round-3
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: round-3
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore Binance cache
        uses: actions/cache@v4
        with:
          path: research/cache/binance
          key: explosive-move-oco-grid-round10-${{ runner.os }}-${{ hashFiles('research/explosive_move_oco_grid_round10.py') }}
          restore-keys: |
            explosive-move-real-world-round8-${{ runner.os }}-
            explosive-move-candidate-evolution-round7-${{ runner.os }}-
            explosive-move-${{ runner.os }}-
      - name: Install dependencies
        run: pip install pandas numpy scikit-learn numba
      - name: Run Round 10
        run: python research/explosive_move_oco_grid_round10.py
      - name: Show analysis
        if: always()
        run: cat research/results/explosive_move_oco_grid_round10/ANALYSIS.md || true
      - name: Persist results
        if: always()
        run: |
          if [ ! -d research/results/explosive_move_oco_grid_round10 ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/explosive_move_oco_grid_round10
          git diff --cached --quiet && exit 0
          git commit -m "Store OCO grid Round 10 results"
          git fetch origin round-3
          git rebase origin/round-3
          git push origin HEAD:round-3
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explosive-move-oco-grid-round10
          path: research/results/explosive_move_oco_grid_round10
          retention-days: 90
