name: Pre-Breakout Round 4K MTM Gate Validation

on:
  push:
    paths:
      - 'research/round4k_mtm_gate_validation.py'
      - '.github/workflows/prebreakout-round4k.yml'
  workflow_dispatch:

jobs:
  round4k:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore Binance archive cache
        uses: actions/cache@v4
        with:
          path: research/data
          key: binance-research-data-v1
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run Round 4K research
        run: python research/round4k_mtm_gate_validation.py
      - name: Show summaries
        run: |
          echo '--- independent_summary.csv ---'
          cat research/results/round4k/independent_summary.csv
          echo '--- portfolio_mtm_summary.csv ---'
          cat research/results/round4k/portfolio_mtm_summary.csv
          echo '--- gate_comparison.csv ---'
          cat research/results/round4k/gate_comparison.csv
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: prebreakout-round4k-mtm-gate-validation
          path: research/results/round4k/
          retention-days: 90
