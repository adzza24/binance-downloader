name: Explosive Move Entry Discovery Round 3 Final

on:
  push:
    paths:
      - 'research/explosive_move_entry_discovery_round3.py'
      - '.github/workflows/explosive-move-entry-discovery-round3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Binance cache
        uses: actions/cache@v4
        with:
          path: research/cache/binance
          key: explosive-move-entry-round3-${{ runner.os }}-${{ hashFiles('research/explosive_move_entry_discovery_round3.py', 'research/explosive_move_entry_discovery_round2.py') }}
          restore-keys: |
            explosive-move-entry-round2-${{ runner.os }}-
            explosive-move-${{ runner.os }}-
            early-breakout-${{ runner.os }}-

      - name: Install dependencies
        run: pip install pandas numpy requests numba scikit-learn

      - name: Run entry discovery
        run: python research/explosive_move_entry_discovery_round3.py

      - name: Show analysis
        if: always()
        run: |
          cat research/results/explosive_move_entry_discovery_round3_final/ANALYSIS.md || true
          echo
          cat research/results/explosive_move_entry_discovery_round3_final/causal_entry_summary.csv || true

      - name: Persist Round 3 results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/explosive_move_entry_discovery_round3_final
          git diff --cached --quiet && exit 0
          git commit -m "Store Explosive Move Entry Discovery Round 3 results"
          git pull --rebase origin master
          git push origin master

      - name: Upload Round 3 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explosive-move-entry-discovery-round3
          path: research/results/explosive_move_entry_discovery_round3_final
          retention-days: 90
