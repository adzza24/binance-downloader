name: Analyze High-Purity Same-Time Selector

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'research/analyze_high_purity_selector.py'
      - '.github/workflows/analyze-high-purity-selector.yml'

permissions:
  contents: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/analyze_high_purity_selector.py
            research/build_high_purity_models.py
            research/high_purity_signal_features.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install research environment
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.3 numpy==2.3.5 scipy==1.17.0 joblib==1.5.3 threadpoolctl==3.6.0 scikit-learn==1.8.0 pyarrow

      - name: Download existing canonical Round 2 shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/cache/high_purity_model_source
          gh run download 37243430582 -n drh2-stage3-canonical-0 -D research/cache/high_purity_model_source/drh2-canonical-0
          gh run download 37243430582 -n drh2-stage3-canonical-1 -D research/cache/high_purity_model_source/drh2-canonical-1
          gh run download 37243430582 -n drh2-stage3-canonical-2 -D research/cache/high_purity_model_source/drh2-canonical-2
          gh run download 37243430582 -n drh2-stage3-canonical-3 -D research/cache/high_purity_model_source/drh2-canonical-3

      - name: Analyze selector
        run: python research/analyze_high_purity_selector.py

      - name: Commit analysis outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git add --sparse -f research/results/daily_return_harvest/high_purity_runtime/selector_analysis/
          if git diff --cached --quiet; then
            echo "No output changes to commit"
            exit 0
          fi
          git commit -m "Add high-purity selector analysis results"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin master
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: high-purity-selector-analysis
          path: research/results/daily_return_harvest/high_purity_runtime/selector_analysis/
          retention-days: 30
