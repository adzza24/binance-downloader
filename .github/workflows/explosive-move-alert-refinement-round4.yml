name: Explosive Move Alert Refinement Round 4

on:
  push:
    branches:
      - round-3
    paths:
      - 'research/explosive_move_alert_refinement_round4.py'
      - '.github/workflows/explosive-move-alert-refinement-round4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: explosive-move-alert-refinement-round4-round-3
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout round-3 branch
        uses: actions/checkout@v4
        with:
          ref: round-3
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Binance cache
        uses: actions/cache@v4
        with:
          path: research/cache/binance
          key: explosive-move-alert-refinement-round4-${{ runner.os }}-${{ hashFiles('research/explosive_move_alert_refinement_round4.py', 'research/explosive_move_discovery_round1.py') }}
          restore-keys: |
            explosive-move-recall-round3-${{ runner.os }}-
            explosive-move-entry-round3-${{ runner.os }}-
            explosive-move-${{ runner.os }}-
            early-breakout-${{ runner.os }}-

      - name: Install dependencies
        run: pip install pandas numpy requests numba scikit-learn

      - name: Run alert refinement research
        run: python research/explosive_move_alert_refinement_round4.py

      - name: Show analysis
        if: always()
        run: |
          cat research/results/explosive_move_alert_refinement_round4/ANALYSIS.md || true
          echo
          cat research/results/explosive_move_alert_refinement_round4/filter_ladder.csv || true

      - name: Persist checkpoints and results
        if: always()
        run: |
          if [ ! -d research/results/explosive_move_alert_refinement_round4 ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/explosive_move_alert_refinement_round4
          git diff --cached --quiet && exit 0
          git commit -m "Store Explosive Move Alert Refinement Round 4 progress"
          git fetch origin round-3
          git rebase origin/round-3
          git push origin HEAD:round-3

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explosive-move-alert-refinement-round4
          path: research/results/explosive_move_alert_refinement_round4
          retention-days: 90
