name: Pre-Breakout Round 4J MA Override

on:
  push:
    paths:
      - 'research/round4j_ma_override.py'
      - '.github/workflows/prebreakout-round4j.yml'
  workflow_dispatch:

jobs:
  round4j:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore Binance archive cache
        uses: actions/cache@v4
        with:
          path: research/data
          key: binance-research-data-v1
      - name: Install dependencies
        run: pip install pandas numpy requests
      - name: Run Round 4J research
        run: python research/round4j_ma_override.py
      - name: Show summary
        run: |
          echo '--- summary.csv ---'
          cat research/results/round4j/summary.csv
          echo '--- comparison_summary.csv ---'
          cat research/results/round4j/comparison_summary.csv
          echo '--- ma_stage_summary.csv ---'
          cat research/results/round4j/ma_stage_summary.csv
          echo '--- year_summary.csv ---'
          cat research/results/round4j/year_summary.csv
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: prebreakout-round4j-ma-override
          path: research/results/round4j/
          retention-days: 90
