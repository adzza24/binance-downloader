name: Pre-Breakout Round 4 Regime Gating

on:
  push:
    paths:
      - 'research/round4_regime_gating.py'
      - '.github/workflows/prebreakout-round4.yml'
  workflow_dispatch:

jobs:
  round4:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: 1
      BINANCE_CACHE_DIR: research/cache/binance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/requirements.txt
      - name: Restore Binance archive cache
        uses: actions/cache@v4
        with:
          path: research/cache/binance
          key: binance-hourly-${{ runner.os }}-v1
          restore-keys: |
            binance-hourly-${{ runner.os }}-
            binance-vision-v2-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r research/requirements.txt
      - name: Run Round 4
        run: python research/round4_regime_gating.py
      - name: Show results
        run: |
          cat research/results/round4/summary.csv
          cat research/results/round4/risk_score_diagnostics.csv
      - name: Upload Round 4 results
        uses: actions/upload-artifact@v4
        with:
          name: prebreakout-round4-regime-gating
          path: research/results/round4/*
          retention-days: 30
