name: Explosive Move Discovery Round 1

on:
  push:
    paths:
      - 'research/explosive_move_discovery_round1.py'
      - '.github/workflows/explosive-move-discovery-round1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore Binance archive cache
        uses: actions/cache@v4
        with:
          path: research/cache/binance
          key: explosive-move-binance-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            explosive-move-binance-v1-${{ runner.os }}-
            early-breakout-binance-v1-${{ runner.os }}-
      - name: Install dependencies
        run: pip install pandas numpy requests numba scikit-learn
      - name: Run discovery
        run: python research/explosive_move_discovery_round1.py
      - name: Show analysis
        run: |
          cat research/results/explosive_move_discovery_round1/ANALYSIS.md
          echo '--- event_summary.csv ---'
          cat research/results/explosive_move_discovery_round1/event_summary.csv
          echo '--- top stable features ---'
          head -80 research/results/explosive_move_discovery_round1/stable_features.csv
      - name: Persist discovery results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/explosive_move_discovery_round1/
          git commit -m "Store Explosive Move Discovery Round 1 results"
          git pull --rebase origin master
          git push origin HEAD:master
      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: explosive-move-discovery-round1
          path: research/results/explosive_move_discovery_round1/
          retention-days: 90
