name: Pre-Breakout Round 3F Gain-Trail Discovery

on:
  push:
    paths:
      - 'research/round3f_gain_trail_discovery.py'
      - '.github/workflows/prebreakout-round3f.yml'
  workflow_dispatch:

jobs:
  round3f:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      BINANCE_CACHE_DIR: research/cache/binance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Restore Binance archive cache
        uses: actions/cache@v4
        with:
          path: research/cache/binance
          key: binance-hourly-${{ runner.os }}-v1
          restore-keys: |
            binance-hourly-${{ runner.os }}-
            binance-vision-v2-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r research/requirements.txt
      - name: Run Round 3F
        run: python research/round3f_gain_trail_discovery.py
      - name: Show results
        if: always()
        run: |
          if [ -f research/results/round3f/required_giveback_quantiles.csv ]; then cat research/results/round3f/required_giveback_quantiles.csv; fi
          if [ -f research/results/round3f/summary.csv ]; then cat research/results/round3f/summary.csv; fi
      - name: Upload Round 3F results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prebreakout-round3f-gain-trail-discovery
          path: research/results/round3f/*
          if-no-files-found: warn
          retention-days: 30
