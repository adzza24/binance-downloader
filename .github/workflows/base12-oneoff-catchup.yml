name: BASE12 One-Off Cohort Catch-up (Research Only)
on:
  workflow_dispatch:
  push:
    branches: [base12-bootstrap-20261008]
    paths:
      - 'research/base12_monitor_bootstrap/catchup_request.txt'
permissions:
  contents: write
  actions: read
jobs:
  catch-up:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frozen-model read dependencies only
        run: python -m pip install --quiet numpy pandas scikit-learn joblib numba
      - name: Download previously trained frozen family models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p research/base12_monitor_bootstrap/model_download
          gh run download 37687822307 --repo adzza24/binance-downloader -n base12-monitor-model --dir research/base12_monitor_bootstrap/model_download
          test -s research/base12_monitor_bootstrap/model_download/family_models.joblib
      - name: Convert frozen forest to exact JavaScript representation and validate equivalence
        run: |
          PYTHONPATH=research python research/base12_monitor_bootstrap/export_frozen_json.py \
            research/base12_monitor_bootstrap/model_download/family_models.joblib \
            research/base12_monitor_bootstrap/family_models.json
      - name: Catch up all pre-initialized symbols using frozen model and core
        run: node research/base12_monitor_bootstrap/catchup_all_initialized.js
      - name: Publish cohort CSV and report to research branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE=research/base12_monitor_bootstrap/output
          for F in base12_oneoff_catchup_20261008.csv base12_oneoff_catchup_report.json; do
            test -s "$BASE/$F"
            gh api --method PUT \
              "repos/adzza24/binance-downloader/contents/$BASE/$F" \
              -f message="research: one-off BASE12 caught-up state $F" \
              -f content="$(base64 -w0 "$BASE/$F")" \
              -f branch="base12-bootstrap-20261008" >/dev/null
          done
      - name: Archive result even if publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base12-oneoff-catchup
          path: |
            research/base12_monitor_bootstrap/output/base12_oneoff_catchup_20261008.csv
            research/base12_monitor_bootstrap/output/base12_oneoff_catchup_report.json
          retention-days: 14
          if-no-files-found: warn
