name: Pre-Breakout Round 4D Open Position Bear Response

on:
  push:
    paths:
      - 'research/round4d_open_position_bear_response.py'
      - '.github/workflows/prebreakout-round4d.yml'
  workflow_dispatch:

jobs:
  round4d:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: 1
      BINANCE_CACHE_DIR: research/cache/binance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: research/requirements.txt
      - name: Restore Binance archive cache
        uses: actions/cache@v4
        with:
          path: research/cache/binance
          key: binance-hourly-${{ runner.os }}-v1
          restore-keys: |
            binance-hourly-${{ runner.os }}-
            binance-vision-v2-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r research/requirements.txt
      - name: Run Round 4D
        run: python research/round4d_open_position_bear_response.py
      - name: Show headline results
        run: |
          cat research/results/round4d/summary.csv
          cat research/results/round4d/year_summary.csv
      - name: Upload Round 4D results
        uses: actions/upload-artifact@v4
        with:
          name: prebreakout-round4d-open-position-bear-response
          path: research/results/round4d/*
          retention-days: 30
