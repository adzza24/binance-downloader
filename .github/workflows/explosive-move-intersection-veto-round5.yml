name: Explosive Move Intersection Veto Round 5

on:
  push:
    branches:
      - round-3
    paths:
      - 'research/explosive_move_intersection_veto_round5.py'
      - '.github/workflows/explosive-move-intersection-veto-round5.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: explosive-move-intersection-veto-round5-round-3
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout round-3 branch
        uses: actions/checkout@v4
        with:
          ref: round-3
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run intersection veto research
        run: python research/explosive_move_intersection_veto_round5.py

      - name: Show analysis
        if: always()
        run: |
          cat research/results/explosive_move_intersection_veto_round5/ANALYSIS.md || true
          echo
          cat research/results/explosive_move_intersection_veto_round5/evaluation.csv || true
          echo
          cat research/results/explosive_move_intersection_veto_round5/selected_rules.csv || true

      - name: Persist Round 5 results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/explosive_move_intersection_veto_round5
          git diff --cached --quiet && exit 0
          git commit -m "Store Explosive Move Intersection Veto Round 5 results"
          git pull --rebase origin round-3
          git push origin HEAD:round-3

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explosive-move-intersection-veto-round5
          path: research/results/explosive_move_intersection_veto_round5
          retention-days: 90
