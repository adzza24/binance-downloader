name: Pre-Breakout Round 3G Exit Confirmation

on:
  push:
    paths:
      - 'research/round3g_exit_confirmation.py'
      - '.github/workflows/prebreakout-round3g.yml'
  workflow_dispatch:

jobs:
  round3g:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      BINANCE_CACHE_DIR: research/cache/binance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Restore Binance archive cache
        uses: actions/cache@v4
        with:
          path: research/cache/binance
          key: binance-hourly-${{ runner.os }}-v1
          restore-keys: |
            binance-hourly-${{ runner.os }}-
            binance-vision-v2-${{ runner.os }}-
      - name: Install dependencies
        run: pip install -r research/requirements.txt
      - name: Run Round 3G
        run: python research/round3g_exit_confirmation.py
      - name: Show results
        if: always()
        run: |
          for f in summary.csv summary_2022_onward.csv summary_2021_onward.csv; do
            if [ -f research/results/round3g/$f ]; then
              echo "=== $f ==="
              cat research/results/round3g/$f
            fi
          done
      - name: Upload Round 3G results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prebreakout-round3g-exit-confirmation
          path: research/results/round3g/*
          if-no-files-found: warn
          retention-days: 30
